<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Detail</title>
  <link rel="icon" type="image/svg+xml" href="/assets/image/logo/favicon.svg">
  <link rel="icon" type="image/png" href="/assets/image/logo/favicon.png">
  <link rel="stylesheet" href="/css/base/tokens.css">
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .job-detail-wrap {
      max-width: 760px;
      margin: 28px auto;
      padding: 0 16px;
    }
    .job-detail-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
    }
    .job-detail-title {
      margin: 0 0 16px;
      font-size: 26px;
      color: #1d4ed8;
    }
    .job-detail-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }
    .job-detail-item {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 15px;
      color: #334155;
    }
    .job-detail-label {
      font-weight: 700;
      color: #0f172a;
      min-width: 110px;
    }
    .job-last-date-badge {
      display: inline-flex;
      align-items: center;
      font-weight: 700;
      color: #1e3a8a;
      background: #dbeafe;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      padding: 3px 10px;
    }
    .job-not-found {
      margin: 0;
      padding: 14px;
      border: 1px dashed #94a3b8;
      border-radius: 10px;
      background: #fff;
      color: #334155;
    }
  </style>
</head>
<body>
  <main class="job-detail-wrap">
    <section id="jobDetailContainer" aria-live="polite"></section>
  </main>

  <script src="/js/job-detail.js"></script>
</body>
</html>
