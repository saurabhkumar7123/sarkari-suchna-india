<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found</title>
<link rel="icon" type="image/svg+xml" href="/assets/image/logo/favicon.svg">
<link rel="icon" type="image/png" href="/assets/image/logo/favicon.png">
<link rel="apple-touch-icon" href="/assets/image/logo/favicon.png">
<link rel="stylesheet" href="/css/base/tokens.css">
<link rel="stylesheet" href="/css/base/reset.css">
<link rel="stylesheet" href="/css/base/base.css">
<link rel="stylesheet" href="/css/components/header.css">
<link rel="stylesheet" href="/css/components/footer.css">
<style>
.not-found-inner{
  text-align:center;
  padding:48px 0 80px;
  font-family:Arial, sans-serif;
}
.not-found-inner h1{
  font-size:60px;
  color:#e74c3c;
  margin:0 0 8px;
}
.not-found-inner a{
  display:inline-block;
  margin-top:20px;
  padding:10px 20px;
  background:#3498db;
  color:#fff;
  text-decoration:none;
  border-radius:5px;
}
</style>
</head>
<body>
<div id="header"></div>
<div class="main-container">
  <div class="not-found-inner">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for does not exist.</p>
    <a href="/">Go to Home</a>
  </div>
</div>
<div id="footer"></div>
<script src="/js/header.js"></script>
<script src="/js/footer.js"></script>
</body>
</html>
