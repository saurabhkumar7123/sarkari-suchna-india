<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/image/logo/favicon.svg">
<link rel="icon" type="image/png" href="/assets/image/logo/favicon.png">
<link rel="apple-touch-icon" href="/assets/image/logo/favicon.png">
  
  <link rel="stylesheet" href="/css/base/tokens.css">
  <link rel="stylesheet" href="/css/base/reset.css">
  <link rel="stylesheet" href="/css/base/base.css">
  <link rel="stylesheet" href="/css/pages/login.css">
</head>
<body>

<div class="main-container login-wrap">
<div class="login-box">
  <h2>Login</h2>
  <p class="login-subtitle">Sign in to access the admin dashboard</p>

  <label class="input-wrap">
    <span class="input-icon" aria-hidden="true">👤</span>
    <input id="u" placeholder="Username" autocomplete="username">
  </label>

  <label class="input-wrap">
    <span class="input-icon" aria-hidden="true">🔒</span>
    <input id="p" placeholder="Password" type="password" autocomplete="current-password">
  </label>

  <p id="loginError" class="login-error" aria-live="polite"></p>

  <button id="loginBtn">
    <span id="loginBtnText">Login</span>
  </button>
</div>
</div>

<script src="/js/admin-csrf.js"></script>
<script src="/js/login.js"></script>

</body>
</html>
