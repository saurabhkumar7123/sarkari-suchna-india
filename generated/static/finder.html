<div class="job-finder">

<!-- HEADER -->

<div class="finder-header">

<h2 class="finder-title" id="finderDialogTitle">Job Finder</h2>

<button type="button" class="finder-close" aria-label="Close">✕</button>

</div>


<!-- FORM -->

<form class="finder-form" id="finderForm">

<div class="finder-field">

<label class="finder-label">Qualification</label>

<select id="finderQualification" class="finder-input">
<option value="">Select Qualification</option>
<option value="10th">10th</option>
<option value="12th">12th</option>
<option value="iti">ITI</option>
<option value="diploma">Diploma</option>
<option value="graduation">Graduation</option>
<option value="post graduation">Post Graduation</option>
<option value="phd">PhD</option>
</select>

</div>


<div class="finder-field">

<label class="finder-label">State</label>

<select id="finderState" class="finder-input">

<option value="">All India</option>
<option value="uttar pradesh">Uttar Pradesh</option>
<option value="bihar">Bihar</option>
<option value="madhya pradesh">Madhya Pradesh</option>
<option value="rajasthan">Rajasthan</option>
<option value="delhi">Delhi</option>
<option value="uttarakhand">Uttarakhand</option>

</select>

</div>


<div class="finder-field">

<label class="finder-label">Department</label>

<select id="finderDepartment" class="finder-input">

<option value="">All Departments</option>
<option value="police">Police</option>
<option value="railway">Railway</option>
<option value="bank">Bank</option>
<option value="ssc">SSC</option>
<option value="upsc">UPSC</option>
<option value="teaching">Teaching</option>
<option value="defence">Defence</option>
<option value="health">Health</option>

</select>

</div>


<button type="submit" id="finderBtn" class="finder-submit">
Find Jobs
</button>

</form>

</div>
