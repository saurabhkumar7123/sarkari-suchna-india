<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="jobsPageTitle">Jobs Listing | Sarkari Suchna India</title>
  <meta name="description" id="jobsPageDesc" content="Find government jobs by qualification, state and department on Sarkari Suchna India.">
  <link rel="canonical" id="jobsCanonical" href="/jobs.html">

  <link rel="icon" type="image/svg+xml" href="/assets/image/logo/favicon.svg">
  <link rel="icon" type="image/png" href="/assets/image/logo/favicon.png">

  <link rel="stylesheet" href="/css/base/tokens.css">
  <link rel="stylesheet" href="/css/base/reset.css">
  <link rel="stylesheet" href="/css/base/base.css">
  <link rel="stylesheet" href="/css/components/header.css">
  <link rel="stylesheet" href="/css/components/footer.css">
  <link rel="stylesheet" href="/css/components/breadcrumb.css">
  <link rel="stylesheet" href="/css/components/search-overlay.css">
  <link rel="stylesheet" href="/css/pages/finder.css?v=16">
  <link rel="stylesheet" href="/css/pages/jobs.css?v=2">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="page-section jobs-page">

<div id="header"></div>

<main class="jobs-wrap" id="jobsMain">
  <nav class="breadcrumb jobs-breadcrumb" aria-label="Breadcrumb" id="jobsBreadcrumb">
    <a href="/" class="breadcrumb__brand"><i class="fa-solid fa-house breadcrumb__icon" aria-hidden="true"></i>Home</a>
    <span class="breadcrumb__sep" aria-hidden="true">›</span>
    <span class="breadcrumb__current">Jobs</span>
  </nav>

  <div id="jobsFinderStrip" class="jobs-finder-strip" hidden>
    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
    <span>Results from Job Finder — based on filters you selected</span>
  </div>

  <header class="jobs-hero">
    <h1 class="jobs-heading" id="jobsHeading">Jobs</h1>
    <p class="jobs-subheading" id="jobsSubheading">Browse matching government job updates</p>
  </header>

  <div id="jobsInclusiveNote" class="jobs-inclusive-note" hidden>
    Including jobs open for <strong>Central</strong> (Railway, Army, SSC, UPSC…) that match your other filters.
  </div>

  <section class="jobs-toolbar" id="jobsToolbar" aria-label="Search filters and actions">
    <div class="jobs-toolbar__top">
      <p id="jobsCount" class="jobs-count" aria-live="polite">Loading jobs…</p>
      <div class="jobs-toolbar__actions">
        <label class="jobs-sort" for="jobsSort">
          <span class="jobs-sort__label">Sort</span>
          <select id="jobsSort" class="jobs-sort__select" aria-label="Sort results">
            <option value="relevance">Relevance</option>
            <option value="latest">Latest first</option>
            <option value="closing">Closing soon</option>
          </select>
        </label>
        <button type="button" id="jobsShareBtn" class="jobs-btn jobs-btn--ghost" title="Copy search link">
          <i class="fa-solid fa-share-nodes" aria-hidden="true"></i>
          <span>Share</span>
        </button>
        <button type="button" id="jobsEditBtn" class="jobs-btn jobs-btn--primary">
          <i class="fa-solid fa-sliders" aria-hidden="true"></i>
          <span>Edit search</span>
        </button>
      </div>
    </div>
    <div id="jobsFilterChips" class="jobs-filter-chips" aria-live="polite"></div>
  </section>

  <section id="jobsList" class="jobs-list" aria-live="polite"></section>
  <section id="jobsPagination" class="jobs-pagination" aria-live="polite"></section>
</main>

<div id="footer"></div>

<div id="jobFinderModal" class="finder-modal" aria-hidden="true">
  <div class="finder-box" id="jobFinderBox" role="dialog" aria-modal="true" aria-labelledby="finderDialogTitle"></div>
</div>

<script src="/assets/js/vendor/dompurify.min.js" defer></script>
<script src="/js/search.js" defer></script>
<script src="/js/header.js" defer></script>
<script src="/js/footer.js" defer></script>
<script src="/js/job-finder-url.js" defer></script>
<script src="/js/finder.js?v=5" defer></script>
<script src="/js/jobs-page.js" defer></script>
</body>
</html>
