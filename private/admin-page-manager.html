<!DOCTYPE html>
<html>
<head>
<title>Admin Page Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/assets/image/logo/favicon.svg">
<link rel="icon" type="image/png" href="/assets/image/logo/favicon.png">
<link rel="apple-touch-icon" href="/assets/image/logo/favicon.png">
<link rel="stylesheet" href="/css/base/tokens.css">
<link rel="stylesheet" href="/css/admin/dashboard.css?v=8">
<link rel="stylesheet" href="/css/admin/admin-enhancements.css">
<link rel="stylesheet" href="/css/admin/admin-saas-shell.css?v=4">
<link rel="stylesheet" href="/css/admin/admin-sidebar.css?v=23">
<link rel="stylesheet" href="/css/admin/admin-saas-theme.css?v=6">
<link rel="stylesheet" href="/css/admin/admin-design-system.css?v=11">
<link rel="stylesheet" href="/css/admin/admin-confirm.css?v=3">
</head>
<body class="admin-saas-v2" data-admin-breadcrumbs="Content,Published Pages">
<button type="button" class="toggle-btn" id="sidebarToggle" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"><span class="toggle-btn__icon" aria-hidden="true">☰</span><span class="toggle-btn__label">Menu</span></button>
<div class="sidebar" id="sidebar">
  <div class="sidebar-top"></div>
</div>
<div class="main">
  <div class="admin-header">
    <div class="admin-title">Published Pages</div>
    <div class="admin-header-actions">
      <button type="button" class="header-action-btn" id="managerRefreshBtn">Refresh Pages</button>
    </div>
  </div>
  <section class="page-manager" aria-label="Page list">
    <div class="manager-header">
      <h1 class="manager-title">Published Pages</h1>
      <p class="manager-hint">Live/public pages. Search, filter, and manage published content. This is not the review queue. Publish remains a separate manual action.</p>
      <nav class="admin-ops-flow" aria-label="Content workflow">
        <span class="admin-ops-flow__step">Detected Update</span>
        <span class="admin-ops-flow__arrow" aria-hidden="true">→</span>
        <span class="admin-ops-flow__step">Draft</span>
        <span class="admin-ops-flow__arrow" aria-hidden="true">→</span>
        <span class="admin-ops-flow__step">Review</span>
        <span class="admin-ops-flow__arrow" aria-hidden="true">→</span>
        <span class="admin-ops-flow__step">Approve</span>
        <span class="admin-ops-flow__arrow" aria-hidden="true">→</span>
        <span class="admin-ops-flow__step is-current is-locked">Manual Publish</span>
        <span class="admin-ops-flow__arrow" aria-hidden="true">→</span>
        <span class="admin-ops-flow__step is-done">Published</span>
      </nav>
    </div>
    <div class="saas-stats-bar" id="pageManagerStats" hidden aria-live="polite"></div>
    <div class="filters-toolbar">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input type="text" id="searchPage" placeholder="Search by title or slug..." autocomplete="off">
        <button type="button" id="pageSearchClear" class="saas-search-clear is-hidden" aria-label="Clear search">×</button>
        <div id="searchSuggestions" class="search-suggestions"></div>
      </div>
      <div class="filter-group">
        <label for="categoryFilter">Tag</label>
        <select id="categoryFilter">
          <option value="">All</option>
          <option value="__notag">No Tag</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="statusFilter">Status</label>
        <select id="statusFilter"><option value="">All</option></select>
      </div>
      <div class="filter-group">
        <label for="sortOrder">Sort</label>
        <select id="sortOrder">
          <option value="desc">Recently updated</option>
          <option value="asc">Oldest first</option>
        </select>
      </div>
    </div>
    <div id="statusFilterChips" class="status-filter-chips" role="group" aria-label="Quick status filters"></div>
    <div id="expiryFilterChips" class="status-filter-chips expiry-filter-chips" role="group" aria-label="Last date filters"></div>
    <div class="page-list-panel">
      <div class="panel-head"><h3 class="panel-title">Pages</h3></div>
      <div id="pageList" class="page-list-host"></div>
      <nav class="pagination" id="pageManagerPagination" aria-label="Pages pagination">
        <p id="paginationSummary" class="pagination-summary" aria-live="polite"></p>
        <div class="pagination-controls">
          <button type="button" id="prevBtn">Previous</button>
          <div id="pageNumbers" class="page-numbers"></div>
          <button type="button" id="nextBtn">Next</button>
        </div>
      </nav>
    </div>
  </section>
</div>
<script src="/js/admin-csrf.js"></script>
<script src="/js/admin-nav.js?v=24"></script>
<script src="/js/admin-shell.js?v=10"></script>
<script src="/js/admin-idle-session.js?v=1"></script>
<script src="/js/admin-page-toolbar.js?v=1"></script>
<script src="/js/admin-layout.js?v=3"></script>
<script src="/js/admin-notifications.js"></script>
<script src="/js/admin-command-palette.js?v=2"></script>
<script src="/js/admin-ui.js?v=5"></script>
<script src="/js/admin-page-manager.js?v=6"></script>
</body>
</html>
