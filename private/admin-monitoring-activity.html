<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Activity | Monitoring</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/assets/image/logo/favicon.svg">
<link rel="icon" type="image/png" href="/assets/image/logo/favicon.png">
<link rel="apple-touch-icon" href="/assets/image/logo/favicon.png">
<link rel="stylesheet" href="/css/base/tokens.css">
<link rel="stylesheet" href="/css/admin/dashboard.css?v=8">
<link rel="stylesheet" href="/css/admin/admin-enhancements.css">
<link rel="stylesheet" href="/css/admin/admin-saas-shell.css?v=4">
<link rel="stylesheet" href="/css/admin/admin-sidebar.css?v=24">
<link rel="stylesheet" href="/css/admin/admin-saas-theme.css?v=6">
<link rel="stylesheet" href="/css/admin/admin-design-system.css?v=15">
</head>
<body class="admin-saas-v2" data-admin-breadcrumbs="Monitoring,Activity" data-mon-page="activity">
<button type="button" class="toggle-btn" id="sidebarToggle" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"><span class="toggle-btn__icon" aria-hidden="true">☰</span><span class="toggle-btn__label">Menu</span></button>
<div class="sidebar" id="sidebar">
  <div class="sidebar-top"></div>
</div>
<div class="main">
  <header class="mon-workspace-head" aria-label="Monitoring Activity">
    <div class="mon-workspace-head__copy">
      <p class="mon-workspace-head__eyebrow">Monitoring</p>
      <h1 class="mon-workspace-head__title">Activity</h1>
      <p class="mon-workspace-head__sub">Failed queue jobs and retry history for source checks.</p>
    </div>
    <div class="mon-workspace-head__actions">
      <button type="button" class="header-action-btn" id="refreshSitesBtn">Refresh</button>
    </div>
  </header>

  <nav class="mon-switcher" aria-label="Monitoring sections" data-mon-switcher>
    <div class="mon-switcher__bar">
      <div class="mon-switcher__current">
        <span class="mon-switcher__eyebrow">Current section</span>
        <strong class="mon-switcher__value">Activity</strong>
      </div>
      <button type="button" class="mon-switcher__trigger header-action-btn" id="monSwitcherTrigger" aria-expanded="false" aria-controls="monSwitcherMenu" aria-haspopup="listbox">
        Switch section
        <span class="mon-switcher__chevron" aria-hidden="true">▾</span>
      </button>
    </div>
    <div class="mon-switcher__menu" id="monSwitcherMenu" role="listbox" hidden>
      <a class="mon-switcher__option" href="/admin/monitoring">Source Health</a>
      <a class="mon-switcher__option" href="/admin/monitoring/updates">Detected Updates</a>
      <a class="mon-switcher__option is-active" href="/admin/monitoring/activity" aria-current="page">Activity</a>
    </div>
  </nav>

  <div class="mon-content" id="monContent">
    <nav class="admin-ops-flow" aria-label="Content pipeline" id="monitoringPipelineFlow">
      <span class="admin-ops-flow__step is-current">Detected</span>
      <span class="admin-ops-flow__arrow" aria-hidden="true">→</span>
      <span class="admin-ops-flow__step">Draft</span>
      <span class="admin-ops-flow__arrow" aria-hidden="true">→</span>
      <span class="admin-ops-flow__step">Review</span>
      <span class="admin-ops-flow__arrow" aria-hidden="true">→</span>
      <span class="admin-ops-flow__step">Approve</span>
      <span class="admin-ops-flow__arrow" aria-hidden="true">→</span>
      <span class="admin-ops-flow__step is-locked">Manual Publish</span>
      <span class="admin-ops-flow__arrow" aria-hidden="true">→</span>
      <span class="admin-ops-flow__step">Published</span>
    </nav>

    <div class="recent monitoring-failed-block" id="monitoringActivity">
      <div class="admin-page-head">
        <div>
          <h2>Queue Failed Jobs</h2>
          <p class="manager-hint">Errors from source checks. Retry is safe and manual.</p>
        </div>
      </div>
      <div class="filters-toolbar mon-failed-filters">
        <div class="filter-group">
          <label for="failedSort">Sort</label>
          <select id="failedSort">
            <option value="latest">Latest failure</option>
            <option value="frequent">Most frequent failures</option>
          </select>
        </div>
      </div>
      <div id="queueFailedList"></div>
    </div>
  </div>
</div>
<script src="/js/admin-csrf.js"></script>
<script src="/js/admin-nav.js?v=29"></script>
<script src="/js/admin-shell.js?v=15"></script>
<script src="/js/admin-idle-session.js?v=1"></script>
<script src="/js/admin-page-toolbar.js?v=1"></script>
<script src="/js/admin-layout.js?v=3"></script>
<script src="/js/admin-notifications.js?v=2"></script>
<script src="/js/admin-command-palette.js?v=7"></script>
<script src="/js/admin-ui.js"></script>
<script src="/js/admin-monitoring.js?v=3"></script>
</body>
</html>
