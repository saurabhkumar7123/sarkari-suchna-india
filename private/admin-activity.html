<!DOCTYPE html>
<html>
<head>
<title>Admin Activity</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/assets/image/logo/favicon.svg">
<link rel="icon" type="image/png" href="/assets/image/logo/favicon.png">
<link rel="apple-touch-icon" href="/assets/image/logo/favicon.png">
<link rel="stylesheet" href="/css/base/tokens.css">
<link rel="stylesheet" href="/css/admin/dashboard.css?v=5">
<link rel="stylesheet" href="/css/admin/admin-enhancements.css">
<link rel="stylesheet" href="/css/admin/admin-saas-shell.css?v=2">
<link rel="stylesheet" href="/css/admin/admin-sidebar.css?v=2">
</head>
<body data-admin-breadcrumbs="Admin,Activity">
<button type="button" class="toggle-btn" id="sidebarToggle" aria-label="Toggle sidebar">☰</button>
<div class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <h2>Admin Panel</h2>
    <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar">⟨⟩</button>
  </div>
  <div class="nav-group-title">Admin</div>
  <a href="/admin/dashboard"><span class="nav-ico">🏠</span><span class="nav-text">Dashboard</span></a>
  <a href="/admin/page-manager"><span class="nav-ico">📄</span><span class="nav-text">Page Manager</span></a>
  <a href="/admin/monitoring"><span class="nav-ico">📊</span><span class="nav-text">Monitoring</span></a>
  <a href="/admin/alerts"><span class="nav-ico">🔔</span><span class="nav-text">Alerts</span></a>
  <a href="/admin/csv-upload"><span class="nav-ico">📁</span><span class="nav-text">CSV Upload</span></a>
  <a href="/admin/sessions"><span class="nav-ico">🧭</span><span class="nav-text">Sessions</span></a>
  <a href="/admin/activity"><span class="nav-ico">📝</span><span class="nav-text">Activity</span></a>
  <div class="nav-group-title">Content</div>
  <a href="/generator"><span class="nav-ico">➕</span><span class="nav-text">Page Generator</span></a>
  <a href="/upload"><span class="nav-ico">📤</span><span class="nav-text">Upload PDF</span></a>
  <a href="/trash"><span class="nav-ico">🗑</span><span class="nav-text">Trash</span></a>
  <div class="nav-group-title">Homepage</div>
  <a href="/admin/homepage-management"><span class="nav-ico">🌐</span><span class="nav-text">Homepage Management</span></a>
  <div class="nav-group-title">System</div>
  <button type="button" class="sidebar-nav-btn" id="darkModeToggle"><span class="nav-ico">🌙</span><span class="nav-text">Dark Mode</span></button>
  <a href="#" class="logout-link" id="logoutLink"><span class="nav-ico">🚪</span><span class="nav-text">Logout</span></a>
</div>
<div class="main">
  <div class="admin-header">
    <div class="admin-title">📝 Admin Activity</div>
    <div class="admin-header-actions">
      <button type="button" class="header-action-btn" id="exportActivityBtn">Export CSV</button>
      <button type="button" class="header-action-btn" id="refreshActivityBtn">Refresh</button>
    </div>
  </div>
  <section class="monitoring-section">
    <div class="manager-header">
      <h1 class="manager-title">Audit Activity</h1>
      <p class="manager-hint">Track recent admin actions with filters.</p>
    </div>
    <div class="saas-stats-bar" id="activityStats" hidden aria-live="polite"></div>
    <div class="filters-toolbar">
      <div class="filter-group">
        <label for="activityAction">Action</label>
        <input type="text" id="activityAction" placeholder="e.g. login, page_delete">
      </div>
      <div class="filter-group">
        <label for="activityFrom">From</label>
        <input type="date" id="activityFrom">
      </div>
      <div class="filter-group">
        <label for="activityTo">To</label>
        <input type="date" id="activityTo">
      </div>
      <div class="filter-group">
        <button type="button" class="header-action-btn" id="applyActivityFilter">Apply</button>
      </div>
    </div>
    <div id="activityTable" class="sites-table-host"></div>
    <nav class="pagination" id="activityPaginationNav" aria-label="Activity pagination">
      <p id="activityPaginationSummary" class="pagination-summary" aria-live="polite"></p>
      <div class="pagination-controls">
        <button type="button" id="activityPrevBtn">Previous</button>
        <div id="activityPageNumbers" class="page-numbers"></div>
        <button type="button" id="activityNextBtn">Next</button>
      </div>
    </nav>
  </section>
</div>
<script src="/js/admin-csrf.js"></script>
<script src="/js/admin-nav.js?v=3"></script>
<script src="/js/admin-shell.js?v=5"></script>
<script src="/js/admin-idle-session.js?v=1"></script>
<script src="/js/admin-page-toolbar.js?v=1"></script>
<script src="/js/admin-layout.js"></script>
<script src="/js/admin-notifications.js"></script>
<script src="/js/admin-command-palette.js?v=2"></script>
<script src="/js/admin-ui.js"></script>
<script src="/js/admin-activity.js"></script>
</body>
</html>
