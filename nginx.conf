# =============================================================================
# NGINX — Sarkari Suchna (proxy to Node at 127.0.0.1:3000)
# =============================================================================
# Before use:
#   1. Replace ALL occurrences of:
#        /var/www/sarkari-suchna
#      with your project root (absolute path, no trailing slash).
#   2. Set server_name to your domain.
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: add a separate server { listen 443 ssl http2; ... } or use certbot --nginx.
# =============================================================================

upstream node_app {
    least_conn;
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Large PDFs / multipart (buffer above raw file size).
    client_max_body_size 100m;

    # ---- API → Node (large uploads: disable buffering) — ^~ matches before location / ----
    location ^~ /api/ {
        client_max_body_size 100m;

        proxy_pass http://node_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_request_buffering off;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://node_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location = /ready {
        proxy_pass http://node_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---- public/assets (CSS, JS, favicon under /assets/image/, …) ----
    location /assets/ {
        alias /var/www/sarkari-suchna/public/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /css/ {
        alias /var/www/sarkari-suchna/public/assets/css/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /js/ {
        alias /var/www/sarkari-suchna/public/assets/js/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ---- storage/uploads (user images + PDFs; matches Express paths) ----
    location /image/ {
        alias /var/www/sarkari-suchna/storage/uploads/images/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /pdf/ {
        alias /var/www/sarkari-suchna/storage/uploads/pdf/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---- generated/ (static HTML trees nginx can map by URL) ----
    location /static/ {
        alias /var/www/sarkari-suchna/generated/static/;
        expires 2m;
        add_header Cache-Control "public, max-age=120, stale-while-revalidate=300";
    }

    location /tools/ {
        alias /var/www/sarkari-suchna/generated/tools/;
        expires 2m;
        add_header Cache-Control "public, max-age=120, stale-while-revalidate=300";
    }

    location /jobs/ {
        alias /var/www/sarkari-suchna/generated/jobs/;
        expires 2m;
        add_header Cache-Control "public, max-age=120, stale-while-revalidate=300";
    }

    location /pages/ {
        alias /var/www/sarkari-suchna/generated/pages/;
        expires 2m;
        add_header Cache-Control "public, max-age=120, stale-while-revalidate=300";
    }

    # ---- HTML routes, /{slug}, /sitemap.xml, /, … → Node ----
    location / {
        proxy_pass http://node_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
