# =============================================================================
# LOCAL: http://localhost (and :8080) → Node http://127.0.0.1:3000
# =============================================================================
# PROJECT ROOT (no trailing slash):
#   C:/Users/ASUS/Desktop/sarkari-suchna-india
# =============================================================================

upstream node_app {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    # Port 80 often needs admin or is reserved on Windows; use 8080 locally.
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 3;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Large PDFs / multipart (buffer above raw file size).
    client_max_body_size 100m;

    # Repo root — must match your folder on disk (forward slashes on Windows)
    set $ROOT "C:/Users/ASUS/Desktop/sarkari suchna india";

    location ^~ /api/ {
        client_max_body_size 100m;

        proxy_pass http://node_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_request_buffering off;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://node_app;
        proxy_set_header Host $host;
    }
    location = /ready {
        proxy_pass http://node_app;
        proxy_set_header Host $host;
    }

    location /assets/ {
        alias $ROOT/public/assets/;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location /css/ {
        alias $ROOT/public/assets/css/;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location /js/ {
        alias $ROOT/public/assets/js/;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location /image/ {
        alias $ROOT/storage/uploads/images/;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    location /pdf/ {
        alias $ROOT/storage/uploads/pdf/;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # /jobs/foo and /jobs/foo.html → generated/jobs/foo.html
    location ~ ^/jobs/(.+)$ {
        root $ROOT/generated;
        try_files /jobs/$1 /jobs/$1.html =404;
        expires 2m;
        add_header Cache-Control "public, max-age=120";
    }

    location /tools/ {
        alias $ROOT/generated/tools/;
        expires 2m;
        add_header Cache-Control "public, max-age=120";
    }

    location /static/ {
        alias $ROOT/generated/static/;
        expires 2m;
        add_header Cache-Control "public, max-age=120";
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
