# =============================================================================
# OPTIONAL: minimal full config for testing with: nginx -t -c thisfile -p NGINX_DIR
# NGINX_DIR = your nginx install folder (contains conf/mime.types), e.g. C:/nginx
#
# Example (Windows, run from nginx install directory):
#   cd C:\nginx
#   nginx.exe -t -p . -c C:/Users/ASUS/Desktop/sarkari-suchna-india/nginx/nginx.local.wrapper.conf
#
# Fix the two paths below: wrapper path + project ROOT in nginx.local.conf (set $ROOT)
# =============================================================================

worker_processes 1;
error_log logs/error.log;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    include C:/Users/ASUS/Desktop/sarkari-suchna-india/nginx/nginx.local.conf;
}
